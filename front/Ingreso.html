<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="app.js" defer></script>

</head>
<body>
    <a href="index.html" class="btn btn-outline-primary">← Volver a Inicio</a>

<nav class="navbar navbar-light bg-light px-3">
  <div class="d-flex align-items-center">
    <a class="nav-link me-3" href="Carreras.html">Ver Carreras</a>
    <a class="nav-link me-3" href="Registro.html">Registrate</a>

  <form class="d-flex ms-auto" action="#" method="get">

    <br><br>

    <div class="container mt-4">
  <h2>Ingresá</h2>
<form id="loginForm">
  <div class="mb-3">
    <label for="email" class="form-label">Correo electrónico</label>
    <input type="email" class="form-control" id="email" required>
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Contraseña</label>
    <input type="password" class="form-control" id="password" required>
  </div>
  <button type="submit" class="btn btn-success">Ingresar</button>
</form>

</div>

</body>
