<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carreras</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="app.js" defer></script>
</head>
<body>

<a href="index.html" class="btn btn-outline-primary">← Volver a Inicio</a>

<nav style="position: static;" class="p-3">
  <a href="Registro.html" class="me-3">Registrate</a> 
  <a href="Ingreso.html" class="me-3">Ingresá</a>
  <form class="d-inline" action="#" method="get">
    <input type="text" name="busqueda" placeholder="Buscar..." class="form-control d-inline w-auto">
    <button type="submit" class="btn btn-primary">Buscar</button>
  </form>
</nav>

<div class="container mt-4">
  <h1>Carreras Disponibles</h1>

  <!-- Menú dinámico de categorías y carreras -->
  <div class="menu" id="careersMenu">
    <!-- Se cargan dinámicamente desde la API -->
  </div>

  <!-- Botón para ir al formulario de registro -->
  <div class="card mt-4">
    <div class="card-header">
      <h3>¿Ya decidiste tu carrera?</h3>
    </div>
    <div class="card-body text-center">
      <p>Registrate ahora desde el formulario completo.</p>
      <a href="Registro.html" class="btn btn-primary btn-lg">Ir al Formulario de Registro</a>
    </div>
  </div>
</div>

<script>
// Cargar carreras desde la API agrupadas por categoría
function loadCareersForMenu() {
  fetch(`${API_BASE}/careers`, { headers })
    .then(res => res.json())
    .then(careers => {
      const menu = document.getElementById('careersMenu');

      const careersByCategory = {};
      careers.forEach(career => {
        if (!careersByCategory[career.category]) {
          careersByCategory[career.category] = [];
        }
        careersByCategory[career.category].push(career);
      });

      menu.innerHTML = '';

      for (const category in careersByCategory) {
        const categoryDiv = document.createElement('div');
        categoryDiv.className = 'tipo';
        categoryDiv.textContent = category;
        categoryDiv.onclick = function () {
          const list = this.nextElementSibling;
          list.classList.toggle('activa');
        };
        menu.appendChild(categoryDiv);

        const careerList = document.createElement('ul');
        careerList.className = 'sublista';

        careersByCategory[category].forEach(career => {
          const li = document.createElement('li');
          li.textContent = career.name;
          if (career.description) li.title = career.description;
          careerList.appendChild(li);
        });

        menu.appendChild(careerList);
      }
    })
    .catch(error => {
      console.error('Error al cargar carreras:', error);
      document.getElementById('careersMenu').innerHTML =
        '<p class="text-danger">No se pudieron cargar las carreras. Intente más tarde.</p>';
    });
}

// Ejecutar la carga cuando se abre la página
document.addEventListener('DOMContentLoaded', loadCareersForMenu);
</script>

</body>
</html>
