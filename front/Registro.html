<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrate</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="app.js" defer></script>
</head>
<body>

  <a href="index.html" class="btn btn-outline-primary">← Volver a Inicio</a>

<nav class="navbar navbar-light bg-light px-3">
  <div class="d-flex align-items-center">
    <a class="nav-link me-3" href="Carreras.html">Ver Carreras</a>
    <a class="nav-link me-3" href="Ingreso.html">Ingresá</a>
  </div>
  <form class="d-flex ms-auto" action="#" method="get">
    <input type="text" name="busqueda" class="form-control me-2" placeholder="Buscar...">
    <button class="btn btn-outline-primary" type="submit">Buscar</button>
  </form>
</nav>


  <div class="container mt-4">
    <h2 class="text-primary">Registrate</h2>
    <form class="row g-3">

      <div class="col-md-6">
        <label for="registerName" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="registerName" required>
      </div>

      <div class="col-md-6">
        <label for="registerDni" class="form-label">DNI</label>
        <input type="text" class="form-control" id="registerDni" required>
      </div>

      <div class="col-md-6">
        <label for="registerEmail" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="registerEmail" required>
      </div>

      <div class="col-md-6">
        <label for="registerPassword" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="registerPassword" required>
      </div>

      <div class="col-md-6">
  <label for="registerCareer" class="form-label">Carrera</label>
  <select class="form-control" id="registerCareer" required>
    <option value="">Cargando carreras...</option>
  </select>
</div>

      <div class="col-12">
        <button type="button" class="btn btn-primary" onclick="registerStudent()">Registrar</button>
      </div>

    </form>
  </div>
<script>
// Cargar carreras al iniciar el formulario de registro//
document.addEventListener('DOMContentLoaded', function() {
  // Cargar carreras desde la API//
  fetch(`${API_BASE}/careers`, { headers })
    .then(res => res.json())
    .then(careers => {
      const select = document.getElementById('registerCareer');
      select.innerHTML = '<option value="">-- Seleccioná una carrera --</option>';
      
      // Agrupar carreras por categoría//
      const careersByCategory = {};
      careers.forEach(career => {
        if (!careersByCategory[career.category]) {
          careersByCategory[career.category] = [];
        }
        careersByCategory[career.category].push(career);
      });
      
      // Crear optgroups para cada categoría//
      for (const category in careersByCategory) {
        const optgroup = document.createElement('optgroup');
        optgroup.label = category;
        
        careersByCategory[category].forEach(career => {
          const option = document.createElement('option');
          option.value = career.name;
          option.textContent = career.name;
          optgroup.appendChild(option);
        });
        
        select.appendChild(optgroup);
      }
      
      // Verificar si hay datos temporales del registro rápido
      const tempData = localStorage.getItem('tempRegistration');
      if (tempData) {
        const { name, email, career } = JSON.parse(tempData);
        document.getElementById('registerName').value = name || '';
        document.getElementById('registerEmail').value = email || '';
        if (career) {
          select.value = career;
        }
        localStorage.removeItem('tempRegistration');
      }
    })
    .catch(error => {
      console.error('Error al cargar carreras:', error);
      document.getElementById('registerCareer').innerHTML = 
        '<option value="">Error al cargar carreras</option>';
    });
});
</script>
</body>
</html>
